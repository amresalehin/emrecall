name: Build APK

concurrency:
  group: emrecall-build-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ main, claude-emrecall ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK and stable signing
        shell: bash
        run: |
          set -euo pipefail
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

          certs="$("$apksigner_path" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$certs" | grep -Fq "Signer: certificate SHA-256 digest: e65566cbe56b1e1a98ec0f3a1d2f924f7d8d136acd812083fe87610fe7880c4b"
          printf '%s\n' "$certs" | grep -Fq "V2 Signer: key size (bits): 2048"

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapMemoryLite-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
