name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path=""
          for candidate in             "$sdk_root/cmdline-tools/latest/bin/sdkmanager"             "$sdk_root/cmdline-tools/bin/sdkmanager"             "$sdk_root/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              sdkmanager_path="$candidate"
              break
            fi
          done

          if [ -z "$sdkmanager_path" ] && [ -d "$sdk_root/cmdline-tools" ]; then
            for candidate in "$sdk_root"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$candidate" ]; then
                sdkmanager_path="$candidate"
                break
              fi
            done
          fi

          if [ -z "$sdkmanager_path" ]; then
            echo "sdkmanager not found under $sdk_root"
            ls -la "$sdk_root" || true
            ls -la "$sdk_root/cmdline-tools" || true
            exit 1
          fi

          echo "Using sdkmanager: $sdkmanager_path"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapMemoryLite-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
