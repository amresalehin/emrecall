name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run JVM tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK and stable signing
        shell: bash
        run: |
          set -euo pipefail
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

          expected="$(keytool -list -v -keystore debug.keystore -storepass emrecall-ci-password -alias emrecall-ci |
            awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          actual="$("$apksigner_path" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk |
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          test -n "$expected"
          test -n "$actual"
          test "$expected" = "$actual"

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapMemoryLite-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
